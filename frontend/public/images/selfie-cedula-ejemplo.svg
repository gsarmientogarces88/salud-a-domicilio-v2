<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de foto de rostro</title>
  <desc id="desc">Ilustración de una foto de frente del rostro bien iluminada</desc>
  <rect width="320" height="200" rx="16" fill="#EAF3FB"/>
  <rect x="12" y="12" width="296" height="176" rx="12" fill="#FFFFFF" stroke="#C5D5E5" stroke-width="1.5"/>
  <!-- Soft light glow -->
  <circle cx="160" cy="88" r="58" fill="#FFF8E7" opacity="0.55"/>
  <!-- Head -->
  <circle cx="160" cy="86" r="42" fill="#D6E6F5"/>
  <!-- Shoulders -->
  <ellipse cx="160" cy="168" rx="58" ry="36" fill="#D6E6F5"/>
  <!-- Eyes / smile -->
  <circle cx="146" cy="80" r="3.5" fill="#7BA3C7"/>
  <circle cx="174" cy="80" r="3.5" fill="#7BA3C7"/>
  <path d="M146 98c7 9 21 9 28 0" stroke="#7BA3C7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Light cue -->
  <path d="M236 42l8-14M248 54l14-6M230 58l10 10" stroke="#E8C96A" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="178" fill="#185FA5" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Rostro de frente · buena luz</text>
</svg>
